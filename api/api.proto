syntax = "proto3";

package ultimate.server.api;

option go_package = "ultimate-game-server/internal/api/apipb";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

message User {
  string id = 1;
  string username = 2;
  string display_name = 3;
  string avatar_url = 4;
  string lang_tag = 5;
  string location = 6;
  string timezone = 7;
  string metadata = 8;
  google.protobuf.Timestamp create_time = 9;
  google.protobuf.Timestamp update_time = 10;
  bool online = 11;
  int32 edge_count = 12;
}

// Score operator override for leaderboard/tournament writes.
enum Operator {
  NO_OVERRIDE = 0;
  BEST = 1;
  SET = 2;
  INCREMENT = 3;
  DECREMENT = 4;
}

// --- Authentication ---

service AuthenticationService {
  rpc AuthenticateEmail(AuthenticateEmailRequest) returns (Session);
  rpc AuthenticateDevice(AuthenticateDeviceRequest) returns (Session);
  rpc AuthenticateApple(AuthenticateAppleRequest) returns (Session);
  rpc AuthenticateGoogle(AuthenticateGoogleRequest) returns (Session);
  rpc AuthenticateFacebook(AuthenticateFacebookRequest) returns (Session);
  rpc AuthenticateSteam(AuthenticateSteamRequest) returns (Session);
  rpc AuthenticateGameCenter(AuthenticateGameCenterRequest) returns (Session);
  rpc AuthenticateFacebookInstantGame(AuthenticateFacebookInstantGameRequest) returns (Session);
  rpc AuthenticateCustom(AuthenticateCustomRequest) returns (Session);

  rpc SessionRefresh(SessionRefreshRequest) returns (Session);
  rpc SessionLogout(SessionLogoutRequest) returns (google.protobuf.Empty);

  rpc GetAccount(google.protobuf.Empty) returns (Account);
  rpc UpdateAccount(UpdateAccountRequest) returns (google.protobuf.Empty);
  rpc DeleteAccount(google.protobuf.Empty) returns (google.protobuf.Empty);

  rpc LinkEmail(AuthenticateEmailRequest) returns (google.protobuf.Empty);
  rpc LinkDevice(AuthenticateDeviceRequest) returns (google.protobuf.Empty);
  rpc LinkApple(AuthenticateAppleRequest) returns (google.protobuf.Empty);
  rpc LinkGoogle(AuthenticateGoogleRequest) returns (google.protobuf.Empty);
  rpc LinkFacebook(AuthenticateFacebookRequest) returns (google.protobuf.Empty);
  rpc LinkSteam(AuthenticateSteamRequest) returns (google.protobuf.Empty);
  rpc LinkCustom(AuthenticateCustomRequest) returns (google.protobuf.Empty);
  rpc LinkGameCenter(AuthenticateGameCenterRequest) returns (google.protobuf.Empty);
  rpc LinkFacebookInstantGame(AuthenticateFacebookInstantGameRequest) returns (google.protobuf.Empty);

  rpc UnlinkEmail(UnlinkRequest) returns (google.protobuf.Empty);
  rpc UnlinkDevice(UnlinkRequest) returns (google.protobuf.Empty);
  rpc UnlinkApple(UnlinkRequest) returns (google.protobuf.Empty);
  rpc UnlinkGoogle(UnlinkRequest) returns (google.protobuf.Empty);
  rpc UnlinkFacebook(UnlinkRequest) returns (google.protobuf.Empty);
  rpc UnlinkSteam(UnlinkRequest) returns (google.protobuf.Empty);
  rpc UnlinkCustom(UnlinkRequest) returns (google.protobuf.Empty);
  rpc UnlinkGameCenter(UnlinkRequest) returns (google.protobuf.Empty);
  rpc UnlinkFacebookInstantGame(UnlinkRequest) returns (google.protobuf.Empty);
}

message AuthenticateEmailRequest {
  string email = 1;
  string password = 2;
  bool create = 3;
  string username = 4;
  string display_name = 5;
}

message AuthenticateDeviceRequest {
  string id = 1;
  bool create = 2;
  string username = 3;
}

message AuthenticateAppleRequest {
  string token = 1;
  bool create = 2;
  string username = 3;
}

message AuthenticateGoogleRequest {
  string token = 1;
  bool create = 2;
  string username = 3;
}

message AuthenticateFacebookRequest {
  string token = 1;
  bool create = 2;
  string username = 3;
}

message AuthenticateSteamRequest {
  bytes ticket = 1;
  bool create = 2;
  string username = 3;
}

message AuthenticateGameCenterRequest {
  string player_id = 1;
  string bundle_id = 2;
  int64 timestamp = 3;
  string salt = 4;
  string signature = 5;
  string public_key_url = 6;
  bool create = 7;
  string username = 8;
}

message AuthenticateFacebookInstantGameRequest {
  string signed_player_info = 1;
  bool create = 2;
  string username = 3;
}

message AuthenticateCustomRequest {
  string id = 1;
  bool create = 2;
  string username = 3;
}

message SessionRefreshRequest {
  string token = 1;
  string refresh_token = 2;
}

message SessionLogoutRequest {
  string token = 1;
  string refresh_token = 2;
}

message Session {
  string token = 1;
  string refresh_token = 2;
  bool created = 3;
  string user_id = 4;
  string username = 5;
}

message Device {
  string id = 1;
}

message Account {
  User user = 1;
  repeated Device devices = 2;
  string email = 3;
  string custom_id = 4;
  google.protobuf.Timestamp verify_time = 5;
  string wallet = 6; // JSON string of currency balances
}

message UpdateAccountRequest {
  string display_name = 1;
  string avatar_url = 2;
  string lang_tag = 3;
  string location = 4;
  string timezone = 5;
  string metadata = 6;
  string username = 7;
}

message UnlinkRequest {
  string id = 1;
}

// --- Leaderboard ---

service LeaderboardService {
  rpc CreateLeaderboard(CreateLeaderboardRequest) returns (google.protobuf.Empty);
  rpc DeleteLeaderboard(DeleteLeaderboardRequest) returns (google.protobuf.Empty);
  rpc ListLeaderboards(ListLeaderboardsRequest) returns (LeaderboardList);
  rpc WriteLeaderboardRecord(WriteLeaderboardRecordRequest) returns (LeaderboardRecord);
  rpc ListLeaderboardRecords(ListLeaderboardRecordsRequest) returns (LeaderboardRecordList);
  rpc ListLeaderboardRecordsAroundOwner(ListLeaderboardRecordsAroundOwnerRequest) returns (LeaderboardRecordList);
  rpc DeleteLeaderboardRecord(DeleteLeaderboardRecordRequest) returns (google.protobuf.Empty);
}

message CreateLeaderboardRequest {
  string id = 1;
  string sort_order = 2; // "ascending" or "descending"
  string operator = 3;   // "best", "set", "increment", "decrement"
  string reset_schedule = 4; // Cron format
  string metadata = 5; // JSON string format
  bool authoritative = 6;
  bool enable_ranks = 7;
}

message ListLeaderboardsRequest {
  int32 limit = 1;
  string cursor = 2;
}

message Leaderboard {
  string id = 1;
  string sort_order = 2;
  string operator = 3;
  string reset_schedule = 4;
  string metadata = 5;
  bool authoritative = 6;
  google.protobuf.Timestamp create_time = 7;
  int64 prev_reset = 8;
  int64 next_reset = 9;
  bool enable_ranks = 10;
}

message LeaderboardList {
  repeated Leaderboard leaderboards = 1;
  string next_cursor = 2;
}

message DeleteLeaderboardRequest {
  string id = 1;
}

message WriteLeaderboardRecordRequest {
  string leaderboard_id = 1;
  int64 score = 2;
  int64 subscore = 3;
  string metadata = 4; // JSON string format
  Operator override_operator = 5;
}

message LeaderboardRecord {
  string leaderboard_id = 1;
  string owner_id = 2;
  string username = 3;
  int64 score = 4;
  int64 subscore = 5;
  string metadata = 6; // JSON string format
  int64 rank = 7;
  google.protobuf.Timestamp create_time = 8;
  google.protobuf.Timestamp update_time = 9;
  google.protobuf.Timestamp expiry_time = 10;
  int32 num_score = 11;
  int32 max_num_score = 12;
}

message ListLeaderboardRecordsRequest {
  string leaderboard_id = 1;
  int32 limit = 2;
  string cursor = 3;
  repeated string owner_ids = 4;
  int64 expiry = 5; // optional override unix expiry
}

message ListLeaderboardRecordsAroundOwnerRequest {
  string leaderboard_id = 1;
  string owner_id = 2;
  int32 limit = 3;
  int64 expiry = 4;
}

message LeaderboardRecordList {
  repeated LeaderboardRecord records = 1;
  string next_cursor = 2;
  string prev_cursor = 3;
  repeated LeaderboardRecord owner_records = 4;
}

message DeleteLeaderboardRecordRequest {
  string leaderboard_id = 1;
}

// --- Tournament ---

service TournamentService {
  rpc CreateTournament(CreateTournamentRequest) returns (google.protobuf.Empty);
  rpc DeleteTournament(DeleteTournamentRequest) returns (google.protobuf.Empty);
  rpc JoinTournament(JoinTournamentRequest) returns (google.protobuf.Empty);
  rpc ListTournaments(ListTournamentsRequest) returns (TournamentList);
  rpc WriteTournamentRecord(WriteTournamentRecordRequest) returns (LeaderboardRecord);
  rpc ListTournamentRecords(ListTournamentRecordsRequest) returns (LeaderboardRecordList);
  rpc ListTournamentRecordsAroundOwner(ListTournamentRecordsAroundOwnerRequest) returns (LeaderboardRecordList);
  rpc DeleteTournamentRecord(DeleteTournamentRecordRequest) returns (google.protobuf.Empty);
}

message CreateTournamentRequest {
  string id = 1;
  string sort_order = 2;
  string operator = 3;
  string reset_schedule = 4;
  string metadata = 5;
  bool authoritative = 6;
  int32 category = 7;
  string description = 8;
  int32 duration = 9;
  google.protobuf.Timestamp end_time = 10;
  bool join_required = 11;
  int32 max_size = 12;
  int32 max_num_score = 13;
  string title = 14;
  google.protobuf.Timestamp start_time = 15;
}

message DeleteTournamentRequest {
  string id = 1;
}

message JoinTournamentRequest {
  string id = 1;
}

message ListTournamentsRequest {
  int32 category_start = 1;
  int32 category_end = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  int32 limit = 5;
  string cursor = 6;
  bool active = 7;
}

message Tournament {
  string id = 1;
  string sort_order = 2;
  string operator = 3;
  string reset_schedule = 4;
  string metadata = 5;
  bool authoritative = 6;
  int32 category = 7;
  string description = 8;
  int32 duration = 9;
  google.protobuf.Timestamp end_time = 10;
  bool join_required = 11;
  int32 max_size = 12;
  int32 max_num_score = 13;
  string title = 14;
  google.protobuf.Timestamp start_time = 15;
  int32 size = 16;
  bool can_enter = 17;
  int64 start_active = 18;
  int64 end_active = 19;
  int64 prev_reset = 20;
  int64 next_reset = 21;
}

message TournamentList {
  repeated Tournament tournaments = 1;
  string next_cursor = 2;
}

message WriteTournamentRecordRequest {
  string tournament_id = 1;
  int64 score = 2;
  int64 subscore = 3;
  string metadata = 4;
  Operator override_operator = 5;
}

message ListTournamentRecordsRequest {
  string tournament_id = 1;
  int32 limit = 2;
  string cursor = 3;
  repeated string owner_ids = 4;
  int64 expiry = 5;
}

message ListTournamentRecordsAroundOwnerRequest {
  string tournament_id = 1;
  string owner_id = 2;
  int32 limit = 3;
  int64 expiry = 4;
}

message DeleteTournamentRecordRequest {
  string tournament_id = 1;
}

// --- Friends ---

service FriendsService {
  rpc AddFriends(AddFriendsRequest) returns (google.protobuf.Empty);
  rpc ListFriends(ListFriendsRequest) returns (FriendList);
  rpc ListFriendsOfFriends(ListFriendsOfFriendsRequest) returns (FriendsOfFriendsList);
  rpc DeleteFriends(DeleteFriendsRequest) returns (google.protobuf.Empty);
  rpc BlockFriends(BlockFriendsRequest) returns (google.protobuf.Empty);
  rpc UnblockFriends(UnblockFriendsRequest) returns (google.protobuf.Empty);
  rpc ImportFacebookFriends(ImportFacebookFriendsRequest) returns (google.protobuf.Empty);
  rpc ImportSteamFriends(ImportSteamFriendsRequest) returns (google.protobuf.Empty);
}

message AddFriendsRequest {
  repeated string ids = 1;
  repeated string usernames = 2;
}

message ListFriendsRequest {
  int32 limit = 1;
  int32 state = 2; // 0=friends, 1=sent request, 2=received request, 3=blocked
  string cursor = 3;
}

message ListFriendsOfFriendsRequest {
  int32 limit = 1;
  string cursor = 2;
}

message Friend {
  User user = 1;
  int32 state = 2;
  google.protobuf.Timestamp update_time = 3;
  string metadata = 4;
}

message FriendList {
  repeated Friend friends = 1;
  string next_cursor = 2;
}

message FriendOfFriend {
  string referrer = 1;
  User user = 2;
}

message FriendsOfFriendsList {
  repeated FriendOfFriend friends_of_friends = 1;
  string cursor = 2;
}

message DeleteFriendsRequest {
  repeated string ids = 1;
  repeated string usernames = 2;
}

message BlockFriendsRequest {
  repeated string ids = 1;
  repeated string usernames = 2;
}

message UnblockFriendsRequest {
  repeated string ids = 1;
  repeated string usernames = 2;
}

message ImportFacebookFriendsRequest {
  string token = 1;
  bool reset = 2;
}

message ImportSteamFriendsRequest {
  string steam_token = 1;
  bool reset = 2;
}

// --- Groups ---

service GroupService {
  rpc CreateGroup(CreateGroupRequest) returns (Group);
  rpc UpdateGroup(UpdateGroupRequest) returns (google.protobuf.Empty);
  rpc DeleteGroup(DeleteGroupRequest) returns (google.protobuf.Empty);
  rpc ListGroups(ListGroupsRequest) returns (GroupList);
  rpc JoinGroup(JoinGroupRequest) returns (google.protobuf.Empty);
  rpc LeaveGroup(LeaveGroupRequest) returns (google.protobuf.Empty);
  
  rpc AddGroupUsers(AddGroupUsersRequest) returns (google.protobuf.Empty);
  rpc KickGroupUsers(KickGroupUsersRequest) returns (google.protobuf.Empty);
  rpc PromoteGroupUsers(PromoteGroupUsersRequest) returns (google.protobuf.Empty);
  rpc DemoteGroupUsers(DemoteGroupUsersRequest) returns (google.protobuf.Empty);
  rpc BanGroupUsers(BanGroupUsersRequest) returns (google.protobuf.Empty);
  
  rpc ListGroupUsers(ListGroupUsersRequest) returns (GroupUserList);
  rpc ListUserGroups(ListUserGroupsRequest) returns (UserGroupList);
}

message CreateGroupRequest {
  string name = 1;
  string description = 2;
  string avatar_url = 3;
  string lang_tag = 4;
  bool open = 5;
  int32 max_count = 6;
  string metadata = 7;
}

message Group {
  string id = 1;
  string creator_id = 2;
  string name = 3;
  string description = 4;
  string avatar_url = 5;
  string lang_tag = 6;
  bool open = 7;
  int32 edge_count = 8;
  int32 max_count = 9;
  string metadata = 10;
  google.protobuf.Timestamp create_time = 11;
  google.protobuf.Timestamp update_time = 12;
}

message UpdateGroupRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string avatar_url = 4;
  string lang_tag = 5;
  bool open = 6;
  string metadata = 7;
}

message DeleteGroupRequest {
  string id = 1;
}

message ListGroupsRequest {
  string name = 1;
  string lang_tag = 2;
  optional bool open = 3;
  int32 limit = 4;
  string cursor = 5;
  int32 members = 6;
}

message GroupList {
  repeated Group groups = 1;
  string next_cursor = 2;
}

message JoinGroupRequest {
  string id = 1;
}

message LeaveGroupRequest {
  string id = 1;
}

message AddGroupUsersRequest {
  string group_id = 1;
  repeated string user_ids = 2;
}

message KickGroupUsersRequest {
  string group_id = 1;
  repeated string user_ids = 2;
}

message PromoteGroupUsersRequest {
  string group_id = 1;
  repeated string user_ids = 2;
}

message DemoteGroupUsersRequest {
  string group_id = 1;
  repeated string user_ids = 2;
}

message BanGroupUsersRequest {
  string group_id = 1;
  repeated string user_ids = 2;
}

message GroupUser {
  User user = 1;
  int32 state = 2; // 0=superadmin, 1=admin, 2=member, 3=join_request
}

message GroupUserList {
  repeated GroupUser group_users = 1;
  string next_cursor = 2;
}

message UserGroup {
  Group group = 1;
  int32 state = 2;
}

message UserGroupList {
  repeated UserGroup user_groups = 1;
  string next_cursor = 2;
}

message ListGroupUsersRequest {
  string group_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

message ListUserGroupsRequest {
  string user_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

// --- Matchmaking ---

service MatchmakerService {
  rpc AddMatchmaker(AddMatchmakerRequest) returns (MatchmakerTicket);
  rpc RemoveMatchmaker(RemoveMatchmakerRequest) returns (google.protobuf.Empty);
  rpc GetMatchmakerTicket(GetMatchmakerTicketRequest) returns (MatchmakerTicket);
  rpc GetQueueStats(GetQueueStatsRequest) returns (QueueStats);
  rpc GetMatchmakerStats(google.protobuf.Empty) returns (MatchmakerStats);
}

message AddMatchmakerRequest {
  string queue_name = 1;
  int32 min_count = 2;
  int32 max_count = 3;
  map<string, string> string_properties = 4;
  map<string, double> numeric_properties = 5;
  int32 count_multiple = 6;
  bool reverse_precision = 7;
  string query = 8;
}

message MatchmakerTicket {
  string ticket_id = 1;
  string queue_name = 2;
  string status = 3; // "queued", "matched", "cancelled", "expired"
  string match_id = 4; // empty if not matched yet
  string match_token = 5; // empty if not matched yet
}

message RemoveMatchmakerRequest {
  string ticket_id = 1;
}

message GetMatchmakerTicketRequest {
  string ticket_id = 1;
}

message GetQueueStatsRequest {
  string queue_name = 1;
}

message QueueStats {
  string queue_name = 2;
  int32 ticket_count = 3;
  int32 average_wait_sec = 4;
  int32 active_matches = 5;
}

message MatchmakerStats {
  int32 ticket_count = 1;
  string oldest_ticket_create_time = 2;
  int32 completion_count = 3;
}

// --- Realtime / Match Service ---

service RealtimeService {
  rpc CreateMatch(CreateMatchRequest) returns (Match);
  rpc ListMatches(ListMatchesRequest) returns (MatchList);
  rpc GetMatch(GetMatchRequest) returns (Match);
  rpc MatchSignal(MatchSignalRequest) returns (MatchSignalResponse);
}

message CreateMatchRequest {
  string module = 1;
  map<string, string> params = 2;
}

message ListMatchesRequest {
  int32 limit = 1;
  bool authoritative = 2;
  string label = 3;
  int32 min_size = 4;
  int32 max_size = 5;
}

message GetMatchRequest {
  string match_id = 1;
}

message MatchPresence {
  string user_id = 1;
  string username = 2;
  string session_id = 3;
}

message Match {
  string match_id = 1;
  bool authoritative = 2;
  string label = 3;
  int32 size = 4;
  int32 max_size = 5;
  repeated MatchPresence presences = 6;
}

message MatchList {
  repeated Match matches = 1;
}

message MatchSignalRequest {
  string match_id = 1;
  string payload = 2;
}

message MatchSignalResponse {
  string response = 1;
}

// --- Party Service ---

service PartyService {
  rpc ListParties(ListPartiesRequest) returns (PartyList);
}

message ListPartiesRequest {
  int32 limit = 1;
  optional bool open = 2;
  string query = 3;
  string cursor = 4;
}

message Party {
  string id = 1;
  bool open = 2;
  bool hidden = 3;
  int32 max_size = 4;
  string label = 5;
}

message PartyList {
  repeated Party parties = 1;
  string cursor = 2;
}

// --- Chat Service ---

service ChatService {
  rpc ListChannelMessages(ListChannelMessagesRequest) returns (ChannelMessageList);
}

message ListChannelMessagesRequest {
  string channel_id = 1;
  int32 limit = 2;
  optional bool forward = 3;
  string cursor = 4;
}

message ChannelMessage {
  string channel_id = 1;
  string message_id = 2;
  int32 code = 3;
  string sender_id = 4;
  string username = 5;
  string content = 6;
  google.protobuf.Timestamp create_time = 7;
  google.protobuf.Timestamp update_time = 8;
  bool persistent = 9;
  string room_name = 10;
  string group_id = 11;
  string user_id_one = 12;
  string user_id_two = 13;
}

message ChannelMessageList {
  repeated ChannelMessage messages = 1;
  string next_cursor = 2;
  string prev_cursor = 3;
  string cacheable_cursor = 4;
}

// --- Notification Service ---

service NotificationService {
  rpc ListNotifications(ListNotificationsRequest) returns (NotificationList);
  rpc DeleteNotifications(DeleteNotificationsRequest) returns (google.protobuf.Empty);
}

message ListNotificationsRequest {
  int32 limit = 1;
  string cacheable_cursor = 2;
}

message ApiNotification {
  string id = 1;
  string subject = 2;
  string content = 3;
  int32 code = 4;
  string sender_id = 5;
  google.protobuf.Timestamp create_time = 6;
  bool persistent = 7;
}

message NotificationList {
  repeated ApiNotification notifications = 1;
  string cacheable_cursor = 2;
}

message DeleteNotificationsRequest {
  repeated string ids = 1;
}

// --- Economy Service ---

service EconomyService {
  rpc GetWallet(google.protobuf.Empty) returns (Wallet);
  rpc ListWalletLedger(ListWalletLedgerRequest) returns (WalletLedgerList);
}

message Wallet {
  string wallet = 1; // JSON string of balances
}

message ListWalletLedgerRequest {
  int32 limit = 1;
  string cursor = 2;
}

message WalletLedgerItem {
  string id = 1;
  string user_id = 2;
  string changeset = 3;
  string metadata = 4;
  google.protobuf.Timestamp create_time = 5;
  google.protobuf.Timestamp update_time = 6;
}

message WalletLedgerList {
  repeated WalletLedgerItem items = 1;
  string next_cursor = 2;
}

// --- IAP Service ---

service IAPService {
  rpc ValidatePurchaseApple(ValidatePurchaseAppleRequest) returns (ValidatePurchaseResponse);
  rpc ValidatePurchaseGoogle(ValidatePurchaseGoogleRequest) returns (ValidatePurchaseResponse);
  rpc ValidatePurchaseHuawei(ValidatePurchaseHuaweiRequest) returns (ValidatePurchaseResponse);
  rpc ValidatePurchaseFacebookInstant(ValidatePurchaseFacebookInstantRequest) returns (ValidatePurchaseResponse);
  rpc ValidatePurchaseSamsung(ValidatePurchaseSamsungRequest) returns (ValidatePurchaseResponse);
  rpc ValidateSubscriptionApple(ValidateSubscriptionAppleRequest) returns (ValidateSubscriptionResponse);
  rpc ValidateSubscriptionGoogle(ValidateSubscriptionGoogleRequest) returns (ValidateSubscriptionResponse);
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (SubscriptionList);
  rpc GetSubscription(GetSubscriptionRequest) returns (ValidatedSubscription);
}

message ValidatePurchaseAppleRequest {
  string receipt = 1;
  optional bool persist = 2;
}

message ValidatePurchaseGoogleRequest {
  // Reference-shaped JSON purchase blob (productId/product_id + purchaseToken/purchase_token).
  string purchase = 1;
  // Legacy fields retained for one-release dual-accept.
  string product_id = 2;
  string purchase_token = 3;
  optional bool persist = 4;
}

message ValidatePurchaseHuaweiRequest {
  // Reference field name; also accept purchase_data in HTTP JSON.
  string purchase = 1;
  string purchase_data = 2;
  string signature = 3;
  optional bool persist = 4;
}

message ValidatePurchaseFacebookInstantRequest {
  string signed_request = 1;
  optional bool persist = 2;
}

message ValidatePurchaseSamsungRequest {
  string purchase_id = 1;
  optional bool persist = 2;
}

message ValidatedPurchase {
  string user_id = 1;
  string product_id = 2;
  string transaction_id = 3;
  int32 store = 4;
  google.protobuf.Timestamp purchase_time = 5;
  bool seen_before = 6;
  int32 environment = 7;
  google.protobuf.Timestamp create_time = 8;
  google.protobuf.Timestamp update_time = 9;
  google.protobuf.Timestamp refund_time = 10;
  string provider_response = 11;
}

message ValidatePurchaseResponse {
  repeated ValidatedPurchase validated_purchases = 1;
}

message ValidateSubscriptionAppleRequest {
  string receipt = 1;
  optional bool persist = 2;
}

message ValidateSubscriptionGoogleRequest {
  string product_id = 1;
  string purchase_token = 2;
  optional bool persist = 3;
}

message ValidateSubscriptionResponse {
  ValidatedSubscription validated_subscription = 1;
}

message ValidatedSubscription {
  string user_id = 1;
  string product_id = 2;
  string original_transaction_id = 3;
  int32 store = 4;
  google.protobuf.Timestamp purchase_time = 5;
  google.protobuf.Timestamp expire_time = 6;
  bool active = 7;
  bool seen_before = 8;
  int32 environment = 9;
  google.protobuf.Timestamp create_time = 10;
  google.protobuf.Timestamp update_time = 11;
  google.protobuf.Timestamp refund_time = 12;
  string provider_response = 13;
}

message ListSubscriptionsRequest {
  int32 limit = 1;
  string cursor = 2;
}

message SubscriptionList {
  repeated ValidatedSubscription validated_subscriptions = 1;
  string cursor = 2;
  string prev_cursor = 3;
}

message GetSubscriptionRequest {
  string product_id = 1;
}

// --- RPC Service ---

service RpcService {
  rpc RpcFunc(Rpc) returns (Rpc);
}

message Rpc {
  string id = 1;
  string payload = 2;
  string http_key = 3;
}

// --- Users / Events / System (ADR-0021) ---

service UserService {
  rpc GetUsers(GetUsersRequest) returns (Users);
}

message GetUsersRequest {
  repeated string ids = 1;
  repeated string usernames = 2;
  repeated string facebook_ids = 3;
}

message Users {
  repeated User users = 1;
}

service EventService {
  rpc Event(ClientEvent) returns (google.protobuf.Empty);
}

message ClientEvent {
  string name = 1;
  map<string, string> properties = 2;
  int64 timestamp = 3;
  bool external = 4;
}

service SystemService {
  rpc Healthcheck(google.protobuf.Empty) returns (google.protobuf.Empty);
}


